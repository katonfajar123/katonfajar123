<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="tab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5AC8FA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" rx="36" fill="#F5F5F7"/>

  <!-- folder body -->
  <g filter="url(#shadow)">
    <path d="M72 126C72 107.222 87.2223 92 106 92H325L379 136H1094C1112.78 136 1128 151.222 1128 170V404C1128 425.539 1110.54 443 1089 443H111C89.4609 443 72 425.539 72 404V126Z" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  </g>

  <!-- folder tab -->
  <path d="M106 92H318C330 92 338 96 346 104L379 136H72V126C72 107.222 87.2223 92 106 92Z" fill="url(#tab)"/>

  <!-- tab icon -->
  <rect x="101" y="108" width="34" height="34" rx="10" fill="white" fill-opacity="0.18"/>
  <path d="M111 121H125" stroke="white" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M111 128H129" stroke="white" stroke-width="3.2" stroke-linecap="round"/>

  <text x="150" y="130" fill="white" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">About Me</text>

  <!-- main copy -->
  <text x="116" y="200" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">
    Web Engineer focused on useful digital systems.
  </text>

  <text x="116" y="244" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="18">
    <tspan x="116" dy="0">I build modern websites, internal systems, web applications, automation,</tspan>
    <tspan x="116" dy="28">and search-driven digital experiences.</tspan>
  </text>

  <text x="116" y="319" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="18">
    <tspan x="116" dy="0">Currently exploring the intersection of Web Engineering × SEO × AI Automation,</tspan>
    <tspan x="116" dy="28">turning business requirements into systems that are maintainable, measurable, and pleasant to use.</tspan>
  </text>

  <!-- chips -->
  <rect x="116" y="382" width="197" height="36" rx="18" fill="#F1F5F9"/>
  <text x="214.5" y="405" text-anchor="middle" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Laravel · PHP · JavaScript</text>

  <rect x="326" y="382" width="162" height="36" rx="18" fill="#EFF6FF"/>
  <text x="407" y="405" text-anchor="middle" fill="#0A66C2" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">SEO · Analytics</text>

  <rect x="501" y="382" width="176" height="36" rx="18" fill="#F5F3FF"/>
  <text x="589" y="405" text-anchor="middle" fill="#6D28D9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">AI · Automation</text>

  <!-- side notes -->
  <rect x="788" y="182" width="286" height="174" rx="26" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="818" y="218" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">CURRENTLY INTO</text>
  <text x="818" y="256" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Web × Search × AI</text>
  <text x="818" y="291" fill="#6B7280" font-family="Inter, Arial, sans-serif" font-size="15">Useful products. Cleaner systems.</text>
  <text x="818" y="319" fill="#6B7280" font-family="Inter, Arial, sans-serif" font-size="15">Less repetitive work.</text>
