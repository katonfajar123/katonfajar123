name: Generate Contribution Snake

on:
  # Generate ulang setiap 12 jam
  schedule:
    - cron: "0 */12 * * *"

  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

  # Jalankan juga ketika ada push ke main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generate SVG contribution snake
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Publish hasil SVG ke branch "output"
      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
